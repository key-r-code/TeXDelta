[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "texdelta"
version = "0.1.0a0"
description = "Publication-ready LaTeX diffs with automatic figure comparisons"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "key-r-code"}]
keywords = ["latex", "latexdiff", "academic-writing", "figures"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "jsonschema>=4.23",
  "mypy>=1.11",
  "pillow>=10.4",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "tomli>=2.0",
]

[project.scripts]
texdelta = "texdelta.cli:main"

[project.urls]
Homepage = "https://github.com/key-r-code/TeXDelta"
Issues = "https://github.com/key-r-code/TeXDelta/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
texdelta = ["templates/*.tex", "overleaf_template.zip"]

[tool.pytest.ini_options]
addopts = "-q --cov=texdelta --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["texdelta"]

[tool.coverage.report]
omit = ["src/texdelta/__main__.py"]
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = ["tools/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["texdelta"]
